name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est déjà présent sur les machines GitHub (ANDROID_HOME)
      - name: Compiler
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: PongDuo-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PongDuo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PongDuo.apk --title "Pong Duo" --notes "Télécharger PongDuo.apk et l'ouvrir sur le téléphone."
